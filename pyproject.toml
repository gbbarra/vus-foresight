[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vus-foresight"
version = "0.1.0"
description = "Evidence Gap Map for clinical genomics: where uncertainty lives, and what it would cost to remove it."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "polars>=1.0",
    "pydantic>=2.6",
    "duckdb>=1.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
# Everything the quality gates need. All development-only: the runtime
# dependency set above is what a consumer installs, and it does not grow.
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "pytest-bdd>=7.0",
    "ruff>=0.16",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "radon>=6.0",
]
# Mutation testing is deliberately not in dev: it is slow, run on demand when a
# module is closed rather than in the development loop, and pinning it into
# every install invites running it by accident.
mutation = ["mutmut>=3.0"]

[project.scripts]
vus-foresight = "vus_foresight.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vus_foresight = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "requires_reference: needs a real reference transcript resource that is not vendored",
    "validation_study: section 10 protocol, run on demand and not in CI",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Selected explicitly rather than taken from the installed version's defaults.
# A gate whose rule set moves when the tool is upgraded fails for reasons that
# have nothing to do with the commit, which is the opposite of what this
# project claims about reproducibility.
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade
    "B",        # bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
    "PIE",
    "FLY",
    "RUF",
]
ignore = [
    # Line length is the formatter's job. Leaving it selected means a long URL
    # in a comment fails the gate while the formatter refuses to fix it.
    "E501",
    # Timestamps here are deliberately naive and fixed (a 1970 epoch) because
    # two runs that differ only in their clock are not reproducible, and the
    # determinism test compares bytes. A tz-aware default would defeat that.
    "DTZ",
]

[tool.ruff.lint.per-file-ignores]
# typer.Option(...) as a parameter default IS the framework's interface. B008
# is right in general and wrong here; the alternative is a sentinel plus a
# lookup in every command body.
"src/vus_foresight/cli.py" = ["B008", "UP007", "UP045"]
# UP007/UP045 are held back on the CLI for a sequencing reason: Typer resolves
# these annotations at runtime to build the parser, and the CLI currently has
# no test at all. They come off in the phase that gives it one.

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# pyarrow ships neither stubs nor py.typed. Only the Parquet writer touches it,
# and its schema is asserted by the determinism test rather than by types.
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.vus-foresight]
# The modules whose errors produce a number that looks clinically
# interpretable and is wrong (CLAUDE.md section 7). Enforced by
# tools/check_module_coverage.py, because coverage.py has no per-file floor
# and a critical module can otherwise rot while the project total sails past
# 80% on the back of everything else.
critical_coverage_floor = 95
critical_modules = [
    "acmg.py",
    "engine/gap.py",
    "engine/pvs1.py",
    "engine/evaluator.py",
    "engine/predicates.py",
    "engine/equivalence.py",
    "engine/signature.py",
    "engine/cnv_scoring.py",
    "annotate/annotator.py",
    "annotate/hgvs.py",
    "annotate/indel.py",
    "genome/transcript.py",
    "validation.py",
]

[tool.bandit]
# Reported, reviewed, and accepted rather than silenced blindly:
#
#   B101 (assert)  Three uses, all type narrowing after a check that already
#                  raised, or after a model validator that guarantees the
#                  shape. None of them is a validation guard, which is the
#                  thing B101 exists to catch.
#   B311 (random)  Deterministically seeded generation of the synthetic gene
#                  used by the tests. The determinism IS the requirement --
#                  the suite compares output bytes -- so a CSPRNG here would
#                  break the guarantee rather than strengthen anything.
#
# CI gates on medium severity and above, which is stricter than the standard's
# "no high-severity finding" and never weaker. The lows stay visible in the
# run summary rather than being configured out of existence.
exclude_dirs = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/vus_foresight"]

[tool.coverage.report]
# Per the standard: coverage measures absence, so it should not be diluted by
# lines that cannot carry a decision.
exclude_also = [
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@(abc\\.)?abstractmethod",
    # A Protocol or stub body, and nothing else. Anchored on purpose: an
    # unanchored ellipsis also matches 'typer.Option(...)' and 'tuple[X, ...]',
    # which would quietly excuse 18 real lines in the CLI alone -- the module
    # with the least coverage in the project. An exclusion that hides the
    # uncovered code is worse than no exclusion.
    "^\\s*\\.\\.\\.\\s*$",
]
show_missing = true
