# ENIGMA BRCA1/BRCA2 VCEP specification -- STRUCTURE COMPLETE, THRESHOLDS UNVERIFIED.
#
#   verified: false
#
# Every criterion, strength ladder, mutual-exclusion group, feasibility tag and
# blocking mapping below reflects the shape of the ENIGMA BRCA1/2 specification.
# The *numeric* thresholds are placeholders carrying the value most commonly
# cited for each criterion, and they have NOT been checked line by line against
# the published ClinGen document.
#
# The distinction is the whole point of keeping rules as data: the structure is
# engineering and is testable today; the numbers are curation and must be
# checked by someone with the document open. Until `verified` is flipped to
# true, the CLI refuses to write a map from this file without --allow-unverified,
# and no test in CI depends on any value here.
#
# Curation checklist for whoever verifies this file:
#   [ ] BA1 / BS1 filtering-allele-frequency thresholds and which FAF gnomAD field
#   [ ] PM2_Supporting threshold and whether it is FAF or raw popmax
#   [ ] BayesDel (or the predictor the VCEP mandates) PP3 / BP4 thresholds
#   [ ] SpliceAI thresholds for PP3 / BP4 / BP7 and the splice-site window
#   [ ] PS3 / BS3 SGE function-score cut-offs, per gene and per dataset
#   [ ] PM1 domain boundaries -- these live in config/genes/BRCA{1,2}.yaml
#   [ ] PVS1 modifications specific to BRCA1 and BRCA2
#   [ ] required observation counts for PP1 / BS4 / PS4 / PM3

spec_id: enigma_brca
name: ENIGMA BRCA1 and BRCA2 VCEP specification
version: 1.1.0
verified: false
genes: [BRCA1, BRCA2]
source: >-
  ClinGen ENIGMA BRCA1/BRCA2 Variant Curation Expert Panel specification to the
  ACMG/AMP variant interpretation guidelines. Thresholds in this file are
  placeholders pending line-by-line curation.

point_system:
  pathogenic_points: {supporting: 1, moderate: 2, strong: 4, very_strong: 8}
  benign_points: {supporting: -1, moderate: -2, strong: -4, very_strong: -8, stand_alone: -8}
  threshold_pathogenic: 10
  threshold_likely_pathogenic: 6
  threshold_likely_benign: -1
  threshold_benign: -7

pvs1:
  enabled: true
  nmd_triggered_strength: very_strong
  nmd_triggered_unestablished_strength: strong
  nmd_escape_critical_strength: strong
  nmd_escape_large_strength: strong
  nmd_escape_small_strength: moderate
  min_fraction_removed: 0.10
  critical_region_tags: [critical]
  start_lost_strength: moderate
  splice_requires_prediction: true
  splice_prediction_field: splice.ds_max
  splice_prediction_threshold: 0.5
  splice_disrupted_strength: very_strong

blocking:
  conflict_reason: CONFLICTING_INTRINSIC
  priority:
    - MISSING_FUNCTIONAL
    - MISSING_SEGREGATION
    - MISSING_CASE_CONTROL
    - PREDICTOR_INDETERMINATE
    - FREQUENCY_UNINFORMATIVE
  default: PREDICTOR_INDETERMINATE

equivalence:
  never_collapse: [missense]

gap:
  max_cardinality: 4
  max_sets_per_target: 5
  include_intractable: false

criteria:
  - code: PVS1
    direction: pathogenic
    evidence_class: intrinsic
    strength: very_strong
    applies_to: [nonsense, frameshift, splice_donor, splice_acceptor, start_lost]
    requires: [pvs1.strength]
    rule: {field: pvs1.applicable, op: is_true}
    strength_ladder:
      - {strength: very_strong, when: {field: pvs1.strength, op: eq, value: very_strong}}
      - {strength: strong, when: {field: pvs1.strength, op: eq, value: strong}}
      - {strength: moderate, when: {field: pvs1.strength, op: eq, value: moderate}}
      - {strength: supporting, when: {field: pvs1.strength, op: eq, value: supporting}}
    feasibility: available_uningested
    blocks_as: MISSING_FUNCTIONAL
    evidence_template: "{pvs1.rationale}"
    description: Null variant in a gene where loss of function is a known disease mechanism
    notes: PVS1 strength modulation follows the gene config's functional regions.

  - code: BA1
    direction: benign
    evidence_class: intrinsic
    strength: stand_alone
    mutex_group: frequency
    requires: [frequency.gnomad.faf95_popmax]
    rule: {field: frequency.gnomad.faf95_popmax, op: ge, value: 0.001}
    feasibility: available_uningested
    blocks_as: FREQUENCY_UNINFORMATIVE
    evidence_template: "gnomAD FAF95 popmax {frequency.gnomad.faf95_popmax} >= 0.001"
    description: Filtering allele frequency above the stand-alone benign threshold
    notes: THRESHOLD UNVERIFIED.

  - code: BS1
    direction: benign
    evidence_class: intrinsic
    strength: strong
    mutex_group: frequency
    requires: [frequency.gnomad.faf95_popmax]
    rule:
      all:
        - {field: frequency.gnomad.faf95_popmax, op: ge, value: 0.0001}
        - {field: frequency.gnomad.faf95_popmax, op: lt, value: 0.001}
    feasibility: available_uningested
    blocks_as: FREQUENCY_UNINFORMATIVE
    evidence_template: "gnomAD FAF95 popmax {frequency.gnomad.faf95_popmax} in [1e-4, 1e-3)"
    description: Filtering allele frequency above the strong benign threshold
    notes: THRESHOLD UNVERIFIED.

  - code: PM2_Supporting
    direction: pathogenic
    evidence_class: intrinsic
    strength: supporting
    mutex_group: frequency
    requires: [frequency.gnomad.faf95_popmax]
    rule: {field: frequency.gnomad.faf95_popmax, op: le, value: 0.00002}
    feasibility: available_uningested
    blocks_as: FREQUENCY_UNINFORMATIVE
    evidence_template: "gnomAD FAF95 popmax {frequency.gnomad.faf95_popmax} <= 2e-5"
    description: Absent or very rare in population databases, at supporting strength
    notes: >-
      THRESHOLD UNVERIFIED. ABraOM frequency is deliberately not consulted here.
      It is reported alongside, in frequency.abraom.*, so that a variant common
      in Brazil and absent from gnomAD is visible rather than scored as if the
      world had looked and found nothing.

  - code: PP3
    direction: pathogenic
    evidence_class: intrinsic
    strength: supporting
    mutex_group: computational
    applies_to: [missense]
    requires: [predictor.bayesdel]
    rule: {field: predictor.bayesdel, op: ge, value: 0.30}
    strength_ladder:
      - {strength: moderate, when: {field: predictor.bayesdel, op: ge, value: 0.50}}
    max_plausible_strength: moderate
    feasibility: available_uningested
    blocks_as: PREDICTOR_INDETERMINATE
    evidence_template: "BayesDel {predictor.bayesdel} >= 0.30"
    description: Computational evidence supports a deleterious effect
    notes: >-
      THRESHOLDS UNVERIFIED. The predictor named here must be the one the VCEP
      mandates, at the VCEP's own calibrated thresholds -- not whichever score
      happens to be in the loaded dbNSFP columns.

  - code: BP4
    direction: benign
    evidence_class: intrinsic
    strength: supporting
    mutex_group: computational
    applies_to: [missense]
    requires: [predictor.bayesdel]
    rule: {field: predictor.bayesdel, op: le, value: 0.18}
    feasibility: available_uningested
    blocks_as: PREDICTOR_INDETERMINATE
    evidence_template: "BayesDel {predictor.bayesdel} <= 0.18"
    description: Computational evidence suggests no impact
    notes: THRESHOLD UNVERIFIED.

  - code: PP3_Splice
    direction: pathogenic
    evidence_class: intrinsic
    strength: supporting
    mutex_group: splice_computational
    applies_to: [splice_region, intronic, synonymous]
    requires: [splice.ds_max]
    rule: {field: splice.ds_max, op: ge, value: 0.20}
    feasibility: available_uningested
    blocks_as: PREDICTOR_INDETERMINATE
    evidence_template: "SpliceAI max delta score {splice.ds_max} >= 0.20"
    description: Splicing prediction supports an effect on the transcript
    notes: THRESHOLD UNVERIFIED.

  - code: BP4_Splice
    direction: benign
    evidence_class: intrinsic
    strength: supporting
    mutex_group: splice_computational
    applies_to: [splice_region, intronic]
    requires: [splice.ds_max]
    rule: {field: splice.ds_max, op: lt, value: 0.10}
    feasibility: available_uningested
    blocks_as: PREDICTOR_INDETERMINATE
    evidence_template: "SpliceAI max delta score {splice.ds_max} < 0.10"
    description: Splicing prediction suggests no effect on the transcript
    notes: THRESHOLD UNVERIFIED.

  - code: PS3
    direction: pathogenic
    evidence_class: intrinsic
    strength: strong
    mutex_group: functional
    requires: [functional.classification]
    rule: {field: functional.classification, op: eq, value: abnormal}
    feasibility: assay_feasible
    feasibility_ladder:
      - feasibility: available_uningested
        when: {field: functional.region_assayed, op: is_true}
    blocks_as: MISSING_FUNCTIONAL
    evidence_template: "{functional.dataset}: {functional.classification} (score {functional.score})"
    description: Saturation genome editing or equivalent assay shows loss of function
    notes: >-
      BRCA1 and BRCA2 have separate, independently calibrated SGE datasets.
      Provenance is stored per variant so a score is never attributed to the
      wrong assay.

  - code: BS3
    direction: benign
    evidence_class: intrinsic
    strength: strong
    mutex_group: functional
    requires: [functional.classification]
    rule: {field: functional.classification, op: eq, value: normal}
    feasibility: assay_feasible
    feasibility_ladder:
      - feasibility: available_uningested
        when: {field: functional.region_assayed, op: is_true}
    blocks_as: MISSING_FUNCTIONAL
    evidence_template: "{functional.dataset}: {functional.classification} (score {functional.score})"
    description: Saturation genome editing or equivalent assay shows retained function

  - code: PM1
    direction: pathogenic
    evidence_class: intrinsic
    strength: moderate
    applies_to: [missense, inframe_deletion]
    requires: [region.tags]
    rule: {field: region.tags, op: contains_any, value: [hotspot, critical]}
    feasibility: available_uningested
    evidence_template: "residue lies in {region.names}"
    description: Located in a critical functional domain
    notes: Domain boundaries live in config/genes/BRCA{1,2}.yaml. UNVERIFIED.

  - code: PM4
    direction: pathogenic
    evidence_class: intrinsic
    strength: moderate
    applies_to: [inframe_deletion, inframe_insertion, stop_lost]
    requires: [region.tags]
    # "Not in a repeat region" is the absence of a tag on a list-valued field,
    # not a scalar membership test.
    rule:
      none:
        - {field: region.tags, op: contains_any, value: [repeat]}
    feasibility: available_uningested
    description: Protein length change in a non-repeat region

  - code: BP7
    direction: benign
    evidence_class: intrinsic
    strength: supporting
    applies_to: [synonymous]
    requires: [splice.ds_max]
    rule:
      all:
        - {field: variant.consequence_terms, op: contains, value: synonymous}
        - {field: splice.ds_max, op: lt, value: 0.1}
    feasibility: available_uningested
    blocks_as: PREDICTOR_INDETERMINATE
    evidence_template: "synonymous, SpliceAI max {splice.ds_max} < 0.1"
    description: Synonymous variant with no predicted splice impact

  - code: PS1
    direction: pathogenic
    evidence_class: semi_intrinsic
    strength: strong
    applies_to: [missense]
    requires: [clinvar.same_protein_change.classification]
    rule:
      field: clinvar.same_protein_change.classification
      op: in
      value: [pathogenic, likely_pathogenic]
    feasibility: available_uningested
    evidence_template: >-
      same amino acid change already classified
      {clinvar.same_protein_change.classification} in ClinVar
    description: Same amino acid change as an established pathogenic variant
    notes: >-
      Temporally dynamic. Always computed against a dated ClinVar snapshot; this
      is the direct hook into vus-hindsight, since a variant can leave VUS
      without any new evidence about itself appearing.

  - code: PM5
    direction: pathogenic
    evidence_class: semi_intrinsic
    strength: moderate
    applies_to: [missense]
    requires: [clinvar.codon.other_change_classification]
    rule:
      field: clinvar.codon.other_change_classification
      op: in
      value: [pathogenic, likely_pathogenic]
    feasibility: available_uningested
    evidence_template: >-
      a different change at this codon is
      {clinvar.codon.other_change_classification} in ClinVar
    description: Novel missense at a codon where a different missense is pathogenic

  - code: PS4
    direction: pathogenic
    evidence_class: extrinsic
    strength: strong
    feasibility: needs_cases
    required_observations: {supporting: 3, moderate: 6, strong: 12}
    blocks_as: MISSING_CASE_CONTROL
    description: Case-control enrichment in affected individuals
    notes: OBSERVATION COUNTS UNVERIFIED.

  - code: PP1
    direction: pathogenic
    evidence_class: extrinsic
    strength: supporting
    max_plausible_strength: strong
    feasibility: needs_families
    required_observations: {supporting: 3, moderate: 5, strong: 7}
    blocks_as: MISSING_SEGREGATION
    description: Co-segregation with disease in multiple affected family members
    notes: OBSERVATION COUNTS UNVERIFIED; reported as N informative meioses.

  - code: BS4
    direction: benign
    evidence_class: extrinsic
    strength: strong
    feasibility: needs_families
    required_observations: {strong: 7}
    blocks_as: MISSING_SEGREGATION
    description: Lack of segregation in affected members of a family

  - code: PM3
    direction: pathogenic
    evidence_class: extrinsic
    strength: moderate
    max_plausible_strength: strong
    feasibility: needs_cases
    required_observations: {supporting: 1, moderate: 2, strong: 4}
    blocks_as: MISSING_CASE_CONTROL
    description: Observed in trans with a pathogenic variant

  - code: BP2
    direction: benign
    evidence_class: extrinsic
    strength: supporting
    feasibility: needs_cases
    blocks_as: MISSING_CASE_CONTROL
    description: Observed in cis with a pathogenic variant, or in trans in a dominant model

  - code: BS2
    direction: benign
    evidence_class: extrinsic
    strength: strong
    feasibility: needs_cases
    blocks_as: MISSING_CASE_CONTROL
    description: Observed in healthy adults

  - code: PS2
    direction: pathogenic
    evidence_class: extrinsic
    strength: strong
    feasibility: intractable
    blocks_as: MISSING_SEGREGATION
    description: De novo, maternity and paternity confirmed
    notes: >-
      Intractable for adult-onset hereditary cancer. De novo events are not
      observable in this disease model, so any evidence set requiring one is not
      a research plan and is excluded from the report by default.

  - code: PM6
    direction: pathogenic
    evidence_class: extrinsic
    strength: moderate
    feasibility: intractable
    blocks_as: MISSING_SEGREGATION
    description: Assumed de novo, without confirmation of maternity and paternity

  - code: PP4
    direction: pathogenic
    evidence_class: extrinsic
    strength: supporting
    feasibility: needs_cases
    blocks_as: MISSING_CASE_CONTROL
    description: Phenotype highly specific for the gene
