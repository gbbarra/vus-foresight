# Residue ranges covered by a saturation genome editing screen. Coverage is what
# separates 'assay_feasible' from 'available_uningested' in the gap report, so an
# empty list here understates how much is already answerable.
mave_datasets: []

notes: >-
  Legacy BIC numbering and the older BRCA1 transcripts are not accepted anywhere
  in this project. If a legacy identifier has to be consumed, it goes through an
  explicit, tested translation layer -- never implicitly.
